# ============================================================================
# KAFKA CONFIGURATION - Production Environment
# ============================================================================

# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ============================================================================
# PRODUCER CONFIGURATION - Maximum Reliability
# ============================================================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Durability: Wait for all in-sync replicas
spring.kafka.producer.acks=all

# Retry logic with exponential backoff
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=100

# Batching for throughput
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger.ms=10
spring.kafka.producer.buffer-memory=67108864

# Compression
spring.kafka.producer.compression-type=snappy

# Timeouts
spring.kafka.producer.properties.request.timeout.ms=60000
spring.kafka.producer.properties.delivery.timeout.ms=300000

# Exactly-once semantics
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.transaction-id-prefix=cms-prod-
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# ============================================================================
# CONSUMER CONFIGURATION - Reliable Processing
# ============================================================================

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:cms-prod-group}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=notificationEvent:com.nexus.cms.payload.NotificationEvent

# Offset management
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1000

# Session & heartbeat
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000

# Fetch configuration
spring.kafka.consumer.properties.fetch.min.bytes=2048
spring.kafka.consumer.properties.fetch.max.wait.ms=10000
spring.kafka.consumer.max-poll-interval-ms=600000

# Isolation level - only read committed messages
spring.kafka.consumer.properties.isolation.level=read_committed

# ============================================================================
# LISTENER CONFIGURATION - Performance Tuning
# ============================================================================

spring.kafka.listener.type=batch
spring.kafka.listener.poll-timeout=10000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=10

# ============================================================================
# ADMIN CONFIGURATION
# ============================================================================

spring.kafka.admin.properties.bootstrap.servers=${spring.kafka.bootstrap-servers}

# ============================================================================
# SSL/TLS CONFIGURATION - Secure Communication
# ============================================================================

spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}

# Uncomment for production with SSL
# spring.kafka.security.protocol=SSL
# spring.kafka.ssl.trust-store-location=${SSL_TRUSTSTORE_LOCATION}
# spring.kafka.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}
# spring.kafka.ssl.key-store-location=${SSL_KEYSTORE_LOCATION}
# spring.kafka.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# spring.kafka.ssl.key-store-type=PKCS12

# ============================================================================
# SASL/SCRAM AUTHENTICATION - Optional
# ============================================================================

# spring.kafka.security.protocol=SASL_SSL
# spring.kafka.sasl.mechanism=SCRAM-SHA-512
# spring.kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients=WARN
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.kafka.listener=DEBUG

# ============================================================================
# METRICS & MONITORING
# ============================================================================

# Enable Kafka metrics for actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Kafka metrics
management.metrics.distribution.percentiles.kafka.broker.network.io.inbytes=0.5,0.95,0.99
management.metrics.enable.kafka=true


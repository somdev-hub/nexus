# ============================================================================
# KAFKA CONFIGURATION - Production Ready
# ============================================================================

# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ============================================================================
# PRODUCER CONFIGURATION
# ============================================================================

# Serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Acks Configuration - 'all' ensures durability in production
spring.kafka.producer.acks=all

# Retry Logic
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=100
spring.kafka.producer.properties.linger.ms=10

# Batching for better throughput
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432

# Compression for reduced network bandwidth
spring.kafka.producer.compression-type=snappy

# Timeout configurations
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000

# Idempotence - ensures exactly-once semantics
spring.kafka.producer.properties.enable.idempotence=true

# Transactional ID for exactly-once delivery
spring.kafka.producer.transaction-id-prefix=cms-

# ============================================================================
# CONSUMER CONFIGURATION
# ============================================================================

# Consumer Group
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:cms-group}

# Deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=notificationEvent:com.nexus.cms.payload.NotificationEvent

# Offset Management - commit after successful processing
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=100
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=500

# Session timeout
spring.kafka.consumer.properties.session.timeout.ms=30000

# Heartbeat configuration
spring.kafka.consumer.properties.heartbeat.interval.ms=10000

# Fetch configuration
spring.kafka.consumer.properties.fetch.min.bytes=1024
spring.kafka.consumer.properties.fetch.max.wait.ms=5000
spring.kafka.consumer.max-poll-interval-ms=300000

# ============================================================================
# LISTENER CONFIGURATION
# ============================================================================

# Container type (batch or single record)
spring.kafka.listener.type=batch
spring.kafka.listener.poll-timeout=5000

# Error handling
spring.kafka.listener.ack-mode=manual_immediate

# Concurrency
spring.kafka.listener.concurrency=5

# ============================================================================
# ADMIN CONFIGURATION
# ============================================================================

# Auto-create topics disabled in production
spring.kafka.admin.properties.bootstrap.servers=${spring.kafka.bootstrap-servers}

# ============================================================================
# SSL/TLS CONFIGURATION (Optional - for secure production)
# ============================================================================
# Uncomment for production environments with SSL
# spring.kafka.security.protocol=SSL
# spring.kafka.ssl.trust-store-location=${SSL_TRUSTSTORE_LOCATION}
# spring.kafka.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}
# spring.kafka.ssl.key-store-location=${SSL_KEYSTORE_LOCATION}
# spring.kafka.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO


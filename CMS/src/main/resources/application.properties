spring.application.name=CMS
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?user=${supabase_uid}.xrcyhvcogjpbjtaiihst&password=${supabase_password}
spring.datasource.username=${supabase_uid}
spring.datasource.password=${supabase_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

dms.endpoint.url=http://localhost:8084/dms
iam.endpoint.url=http://localhost:8080/iam

# Email Configuration
spring.mail.host=${mail.host:smtp.gmail.com}
spring.mail.port=${mail.port:587}
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.from=${mail.from:noreply@nexushr.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.max-recipients=100

# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=100
# CRITICAL: Disable Kafka transactions - async publishing doesn't need them
spring.kafka.producer.transaction-id-prefix=
spring.kafka.properties.enable.idempotence=true

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=cms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.auto.offset.reset=earliest
spring.kafka.consumer.properties.enable.auto.commit=true
spring.kafka.consumer.properties.max.poll.records=100

server.port=8086

spring.application.name=CMS
spring.profiles.active=local

spring.datasource.url=jdbc:postgresql://db.xrcyhvcogjpbjtaiihst.supabase.co:5432/postgres?user=${supabase_uid}&password=${supabase_password}
spring.datasource.username=${supabase_uid}
spring.datasource.password=${supabase_password}

# HikariCP Connection Pool Configuration
# Optimized for concurrent Kafka consumer threads + email processing + WebSocket messages
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=120000
# Enable to prevent prepared statement cache collisions
spring.datasource.hikari.connection-init-sql=SET SESSION statement_timeout = '5min'

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Optimize Hibernate for connection pool
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
# Disable prepared statement caching at Hibernate level to prevent collisions
spring.jpa.properties.hibernate.generate_ddl=false

dms.endpoint.url=http://localhost:8084/dms
iam.endpoint.url=http://localhost:8080/iam
pms.endpoint.url=http://localhost:8083/pms
hr.endpoint.url=http://localhost:8085/hr
dms.upload.org.documents=${dms.endpoint.url}/upload/org
dms.upload.individual.documents=${dms.endpoint.url}/upload/individual
fetch.user.org.details.url=${iam.endpoint.url}/organizations/user-org/details
verify.token.url=${iam.endpoint.url}/auth/verify
generate.token.url=${iam.endpoint.url}/auth/login
decrypt.token.url=${iam.endpoint.url}/auth/decrypt
get.user.details.url=${iam.endpoint.url}/users/get-user
org.detaills.url=${iam.endpoint.url}/organizations/details

# Email Configuration
spring.mail.host=${mail.host:smtp.gmail.com}
spring.mail.port=${mail.port:587}
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.from=${mail.from:noreply@nexushr.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.max-recipients=100

# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=100
# CRITICAL: Disable Kafka transactions - async publishing doesn't need them
spring.kafka.producer.transaction-id-prefix=
spring.kafka.properties.enable.idempotence=true

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=cms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.auto.offset.reset=earliest
spring.kafka.consumer.properties.enable.auto.commit=true
spring.kafka.consumer.properties.max.poll.records=100

server.port=8086

# ============================================================================
# REDIS CONFIGURATION - Session & Cache Management
# ============================================================================

# Redis Connection
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6060}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0

spring.data.redis.host=localhost
spring.data.redis.port=6060
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-idle=1
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.shutdown-timeout=2000ms

# Redis Connection Pool Configuration
#spring.data.redis.lettuce.pool.max-idle=10


# Redis Timeout
spring.redis.timeout=2000ms

# ============================================================================
# WEBSOCKET CONFIGURATION
# ============================================================================

# WebSocket session timeout (milliseconds)
spring.webflux.session.timeout=1800000

# STOMP heartbeat configuration
# Client sends heartbeat every 25 seconds, expects response within 30 seconds
websocket.heartbeat.interval=25000
websocket.heartbeat.timeout=30000

spring.devtools.restart.enabled=false


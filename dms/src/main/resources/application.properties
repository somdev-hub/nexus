spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?user=postgres.xrcyhvcogjpbjtaiihst&password=${supabase_password}&sslmode=require&prepareThreshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.username=${supabase_uid}
spring.datasource.password=${supabase_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
# Transaction isolation level for concurrent operations
spring.jpa.properties.hibernate.connection.isolation=2
# Fix for "prepared statement already exists" errors with concurrent async operations
# Disable Hibernate's prepared statement cache which causes conflicts when connections are recycled
spring.jpa.properties.hibernate.jdbc.ps.batch_size=0
spring.jpa.properties.hibernate.jdbc.ps.max_statements=0
spring.jpa.properties.hibernate.prepare_sql=false

server.port=8084

# S3/Filebase Configuration
s3.accessKeyId=YOUR_ACCESS_KEY_ID
s3.secretAccessKey=YOUR_SECRET_ACCESS_KEY
s3.region=us-east-1
s3.endpoint=https://s3.filebase.com
s3.main-bucket=nexus-scm

s3.endpoint.url=https://ipfs.filebase.io/ipfs
filebase.bucket.url=https://console.filebase.com/buckets/
fetch.user.org.details.url=http://localhost:8080/iam/organizations/user-org/details
verify.token.url=http://localhost:8080/iam/auth/verify
generate.token.url=http://localhost:8080/iam/auth/login
decrypt.token.url=http://localhost:8080/iam/auth/decrypt


# HikariCP Connection Pool Configuration - Fix for PostgreSQL prepared statement issues with concurrent async operations
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
# CRITICAL: Deallocate all prepared statements when connection is borrowed from pool
# This prevents "prepared statement already exists" errors in PostgreSQL
spring.datasource.hikari.connection-init-sql=DEALLOCATE ALL
# Disable all levels of prepared statement caching at JDBC level
spring.datasource.hikari.data-source-properties.cachePreparedStatements=false
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMB=0
# Reset connection state on every borrow
spring.datasource.hikari.data-source-properties.applicationName=nexus-dms

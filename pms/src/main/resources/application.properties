spring.application.name=pms
spring.profiles.active=local

# Database Configuration (Update with your actual database details)
spring.datasource.url=jdbc:postgresql://db.xrcyhvcogjpbjtaiihst.supabase.co:5432/postgres?user=${supabase_uid}&password=${supabase_password}
spring.datasource.username=${supabase_uid}
spring.datasource.password=${supabase_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Hibernate-specific settings
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.validateOnMigrate=true
spring.devtools.restart.enabled=false

server.port=8083
dms.endpoint.url=http://localhost:8084/dms
iam.endpoint.url=http://localhost:8080/iam
hr.endpoint.url=http://localhost:8085/hr

dms.upload.org.documents=${dms.endpoint.url}/upload/org

fetch.user.org.details.url=${iam.endpoint.url}/organizations/user-org/details
verify.token.url=${iam.endpoint.url}/auth/verify
generate.token.url=${iam.endpoint.url}/auth/login
decrypt.token.url=${iam.endpoint.url}/auth/decrypt
get.user.details.url=${iam.endpoint.url}/users/get-user

# Generic user credentials for service-to-service communication
generic.user.id=generic_service_user
generic.password=service_password_placeholder

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer Configuration - Fixes InvalidProducerEpochException
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=100
# CRITICAL: Disable Kafka transactions - async publishing doesn't need them
spring.kafka.producer.transaction-id-prefix=
spring.kafka.properties.enable.idempotence=true

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=pms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.auto.offset.reset=earliest
spring.kafka.consumer.properties.enable.auto.commit=true
spring.kafka.consumer.properties.max.poll.records=100
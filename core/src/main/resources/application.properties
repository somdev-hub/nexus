# ============================================================================
# KAFKA / EVENT SUBSYSTEM (com.nexus.core.event)
# ============================================================================
# The outbox publishes domain events to Kafka. The consumer (CMS) owns the
# topic, but the producer needs the broker address. Kafka transactions are
# deliberately disabled: events are published outside the business transaction
# by the relay, so transactional ids would only add overhead.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=100
spring.kafka.producer.transaction-id-prefix=

# Outbox relay — adaptive scheduling with exponential backoff and circuit breaker.
# The relay only wakes up when there is work due, so an idle outbox costs
# nothing. When Kafka is down the circuit breaker trips and the relay backs
# off to outbox.circuit-breaker.max-timeout-ms.
#
# Set outbox.relay.enabled=false to stop the relay entirely (the outbox is
# still written, but events are never published — useful for dev/test or for
# running a separate relay process).
outbox.relay.enabled=true
outbox.relay.batch-size=100
outbox.relay.max-attempts=10
outbox.relay.retry-backoff-max-ms=60000
outbox.failed-retention.days=30
outbox.replay.enabled=true
outbox.replay.max-replays=3
outbox.replay.cooldown-seconds=60
outbox.health.pending-threshold=1000
outbox.health.max-oldest-pending-seconds=300

# Circuit breaker
outbox.circuit-breaker.failure-threshold=3
outbox.circuit-breaker.initial-timeout-ms=30000
outbox.circuit-breaker.max-timeout-ms=300000
outbox.circuit-breaker.max-idle-sleep-ms=30000


spring.application.name=HR
spring.profiles.active=local
server.port=8085

spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?user=${supabase_uid}.xrcyhvcogjpbjtaiihst&password=${supabase_password}&preparedStatementCacheQueries=0&preparedStatementCacheSizeMB=0
spring.datasource.username=${supabase_uid}
spring.datasource.password=${supabase_password}

# HikariCP Connection Pool Configuration - Fix for PostgreSQL prepared statement issues with concurrent async operations
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
# Disable all levels of prepared statement caching
spring.datasource.hikari.data-source-properties.cachePreparedStatements=false
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMB=0

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
# Transaction isolation level for concurrent operations
spring.jpa.properties.hibernate.connection.isolation=2


# PDF Generation Configuration
app.pdf.organization-name=Nexus Organization
app.pdf.organization-address=123 Business Street, City, Country
app.pdf.hr-contact-email=hr@nexusorg.com
app.pdf.hr-contact-phone=+1-555-0123
app.pdf.output-directory=./generated_documents
app.pdf.store-locally=false
dms.endpoint.url=http://localhost:8084/dms
iam.endpoint.url=http://localhost:8080/iam
dms.upload.org.documents=${dms.endpoint.url}/upload/org

fetch.user.org.details.url=${iam.endpoint.url}/organizations/user-org/details
verify.token.url=${iam.endpoint.url}/auth/verify
generate.token.url=${iam.endpoint.url}/auth/login
decrypt.token.url=${iam.endpoint.url}/auth/decrypt
get.user.details.url=${iam.endpoint.url}/get-user

# Email Configuration
spring.mail.host=${mail.host:smtp.gmail.com}
spring.mail.port=${mail.port:587}
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.from=${mail.from:noreply@nexushr.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.max-recipients=100

# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

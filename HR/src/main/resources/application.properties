# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false
# Transaction isolation level for concurrent operations
spring.jpa.properties.hibernate.connection.isolation=2
# PDF Generation Configuration
app.pdf.organization-name=Nexus Organization
app.pdf.organization-address=123 Business Street, City, Country
app.pdf.hr-contact-email=hr@nexusorg.com
app.pdf.hr-contact-phone=+1-555-0123
app.pdf.output-directory=./generated_documents
app.pdf.store-locally=false
dms.endpoint.url=http://localhost:8084/dms
iam.endpoint.url=http://localhost:8080/iam
pms.endpoint.url=http://localhost:8083/pms
hr.endpoint.url=http://localhost:8085/hr
dms.upload.org.documents=${dms.endpoint.url}/upload/org
fetch.user.org.details.url=${iam.endpoint.url}/organizations/user-org/details
verify.token.url=${iam.endpoint.url}/auth/verify
generate.token.url=${iam.endpoint.url}/auth/login
decrypt.token.url=${iam.endpoint.url}/auth/decrypt
get.user.details.url=${iam.endpoint.url}/users/get-user
org.detaills.url=${iam.endpoint.url}/organizations/details
initiate.payment.url=${pms.endpoint.url}/payments/initiate
hr.payroll.callback.url=${hr.endpoint.url}/payroll/callback
# Email Configuration
spring.mail.host=${mail.host:smtp.gmail.com}
spring.mail.port=${mail.port:587}
spring.mail.username=${mail.username}
spring.mail.password=${mail.password}
spring.mail.from=${mail.from:noreply@nexushr.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.max-recipients=100
# kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
# Kafka Producer Configuration - Fixes InvalidProducerEpochException
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.retry.backoff.ms=100
# CRITICAL: Disable Kafka transactions - async publishing doesn't need them
spring.kafka.producer.transaction-id-prefix=
spring.kafka.properties.enable.idempotence=true
# Kafka Consumer Configuration
spring.kafka.consumer.group-id=hr-payment-callback-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.auto.offset.reset=earliest
spring.kafka.consumer.properties.enable.auto.commit=false
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.max.poll.records=100
# WOWOs
wowo.NORMALIZE-PAY-WITH-ATTENDANCE.active=false

spring.devtools.restart.enabled=false

